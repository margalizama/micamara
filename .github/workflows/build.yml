name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK debug
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: MiCamara-apk
          path: app/build/outputs/apk/debug/app-debug.apk
